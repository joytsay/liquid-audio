# Standalone deployment for an x86-64 Linux host with an NVIDIA RTX GPU.
name: liquid-audio-rtx

services:
  app:
    image: ${RTX_IMAGE:-liquid-audio-rtx:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile.rtx
      # Use the Linux host resolver when downloading CUDA wheels during RUN.
      network: host
      entitlements:
        - network.host
      args:
        RTX_BASE_IMAGE: ${RTX_BASE_IMAGE:-python:3.12-slim-bookworm}
    platform: linux/amd64
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${RTX_GPU_ID:-0}"]
              capabilities: [gpu]
    network_mode: host
    restart: unless-stopped
    working_dir: /workspace
    command: ["python3", "-m", "liquid_audio.demo.chat"]
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTHONPATH: /workspace/src
      PYTHONUNBUFFERED: "1"
      GRADIO_SERVER_NAME: "0.0.0.0"
      GRADIO_SERVER_PORT: "7860"
      HF_HOME: /workspace/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      GRADIO_TEMP_DIR: /workspace/.cache/gradio
    volumes:
      - type: bind
        source: ..
        target: /workspace
    shm_size: "2gb"

  caddy:
    image: caddy:2.11.4-alpine
    platform: linux/amd64
    ports:
      - "7861:443"
      - "7861:443/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - app
    environment:
      RTX_HTTPS_HOST: ${RTX_HTTPS_HOST:-localhost}
    volumes:
      - type: bind
        source: ./Caddyfile.rtx
        target: /etc/caddy/Caddyfile
        read_only: true
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
